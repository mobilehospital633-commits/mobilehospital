<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mh-gear-grad" x1="30" y1="20" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#7dd3fc" />
      <stop offset="20%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#0284c7" />
      <stop offset="78%" stopColor="#0369a1" />
      <stop offset="100%" stopColor="#0c4a6e" />
    </linearGradient>
    <linearGradient id="mh-gear-grad-rim" x1="100" y1="20" x2="100" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#e0f2fe" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#0ea5e9" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#075985" stopOpacity="0.9" />
    </linearGradient>
    <radialGradient id="mh-gear-grad-inner" cx="100" cy="83" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.45" />
      <stop offset="55%" stopColor="#0369a1" stopOpacity="0.65" />
      <stop offset="90%" stopColor="#082f49" stopOpacity="0.95" />
      <stop offset="100%" stopColor="#0284c7" stopOpacity="1" />
    </radialGradient>
    <linearGradient id="mh-copper-grad" x1="60" y1="45" x2="140" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffedd5" />
      <stop offset="18%" stopColor="#fdba74" />
      <stop offset="45%" stopColor="#fb923c" />
      <stop offset="70%" stopColor="#c2410c" />
      <stop offset="90%" stopColor="#9a3412" />
      <stop offset="100%" stopColor="#431407" />
    </linearGradient>
    <linearGradient id="mh-copper-dark-grad" x1="70" y1="45" x2="130" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffedd5" />
      <stop offset="50%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#270902" />
    </linearGradient>
    <filter id="mh-depth-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.8" floodColor="#000000" floodOpacity="0.8" />
    </filter>
  </defs>

  <g style="filter: drop-shadow(0 4px 12px rgba(14, 165, 233, 0.3));">
    <!-- Outer Gear Body -->
    <path
      d="M 92 14 L 108 14 L 111 31 C 117 33 123 36 128 39 L 143 28 L 155 39 L 145 54 C 149 60 152 66 154 72 L 171 75 L 171 91 L 154 94 C 152 100 149 106 145 112 L 155 127 L 143 138 L 128 127 C 123 130 117 133 111 135 L 108 152 L 92 152 L 89 135 C 83 133 77 130 72 127 L 57 138 L 45 127 L 55 112 C 51 106 48 100 46 94 L 29 91 L 29 75 L 46 72 C 48 66 51 60 55 54 L 45 39 L 57 28 L 72 39 C 77 36 83 33 89 31 Z"
      fill="url(#mh-gear-grad)"
      stroke="url(#mh-gear-grad-rim)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Inner Bevel Circle -->
    <circle cx="100" cy="83" r="54" fill="url(#mh-gear-grad-inner)" stroke="#7dd3fc" stroke-width="2" />

    <!-- Circuit Tracks -->
    <circle cx="100" cy="83" r="49" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8" />
    <circle cx="100" cy="83" r="44" fill="none" stroke="#67e8f9" stroke-width="0.8" stroke-dasharray="14 4 3 4" opacity="0.6" />
    <circle cx="100" cy="83" r="40" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.45" />

    <!-- Ticks -->
    <circle cx="100" cy="34" r="2" fill="#e0f2fe" />
    <circle cx="100" cy="132" r="2" fill="#e0f2fe" />
    <circle cx="51" cy="83" r="2" fill="#e0f2fe" />
    <circle cx="149" cy="83" r="2" fill="#e0f2fe" />

    <!-- Monogram MH in 3D Bronze/Copper -->
    <g filter="url(#mh-depth-shadow)">
      <path
        d="M 64 116 L 64 54 L 79 54 L 92 84 L 105 54 L 118 54 L 118 73 L 108 73 L 108 67 L 97 91 L 87 91 L 76 67 L 76 116 Z"
        fill="url(#mh-copper-grad)"
        stroke="url(#mh-copper-dark-grad)"
        stroke-width="1.2"
        stroke-linejoin="round"
      />
      <path
        d="M 98 116 L 98 94 L 122 94 L 122 116 L 134 116 L 134 54 L 122 54 L 122 83 L 98 83 L 98 73 L 107 73 L 107 63 L 96 63 L 94 63 L 86 63 L 86 116 Z"
        fill="url(#mh-copper-grad)"
        stroke="url(#mh-copper-dark-grad)"
        stroke-width="1.2"
        stroke-linejoin="round"
        opacity="0.97"
      />
      <!-- Specular Bevel Highlights -->
      <path d="M 66 56 L 66 114" stroke="#ffedd5" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
      <path d="M 66 56 L 77 56 L 91 85" stroke="#ffedd5" stroke-width="1" stroke-linecap="round" opacity="0.7" />
      <path d="M 124 56 L 132 56" stroke="#ffedd5" stroke-width="1" stroke-linecap="round" opacity="0.7" />
      <path d="M 132 56 L 132 114" stroke="#ffedd5" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
      <path d="M 99 85 L 121 85" stroke="#ffedd5" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Sparkles -->
    <circle cx="72" cy="40" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="128" cy="125" r="1.2" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
